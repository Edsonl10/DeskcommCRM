name: Validar distribuição por departamento

on:
  push:
    branches: [fix/distribuicao-por-departamento]
  pull_request:
    paths:
      - lib/routing/**
      - supabase/**
      - tests/invariants/department-routing.test.ts
      - .github/workflows/department-routing.yml
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: department-routing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  department-routing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
      # Retorno rápido para a reserva do setor; não substitui a matriz completa.
      - name: Entrada, reserva, concorrência e regras do setor em PostgreSQL 17
        run: pnpm test:db tests/invariants/department-routing.test.ts
        env:
          TEST_DB_IMAGE: pgvector/pgvector:pg17
